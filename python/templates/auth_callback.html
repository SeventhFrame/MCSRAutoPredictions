<h1>Twitch authorization</h1>
<p id="message">Completing login...</p>

<script>
  const params = new URLSearchParams(window.location.hash.slice(1));
  const token = params.get("access_token");
  const error = params.get("error_description") || params.get("error");
  const message = document.getElementById("message");

  if (error) {
    message.textContent = `Twitch authorization failed: ${error}`;
  } else if (!token) {
    message.textContent = "No access token was returned.";
  } else {
    fetch("/auth/token", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({access_token: token})
    })
      .then(response => {
        if (!response.ok) {
          throw new Error("Token validation failed");
        }
        return response.json();
      })
      .then(() => {
        window.location.replace("/mcsr-info");
      })
      .catch(() => {
        message.textContent = "Twitch login failed.";
      });
  }
</script>
